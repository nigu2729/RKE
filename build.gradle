buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs = ['-Dbosskiller.coverAll=true']
        }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', mod_id }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    earlybootstrap {
        java { setSrcDirs(['src/earlybootstrap/java']) }
        resources { setSrcDirs(['src/earlybootstrap/resources']) }
    }
}

// Keep earlybootstrap isolated to avoid split package conflicts in module system
sourceSets.earlybootstrap.compileClasspath += sourceSets.main.compileClasspath.minus(sourceSets.earlybootstrap.output)
sourceSets.main.compileClasspath += sourceSets.earlybootstrap.output
// Don't add earlybootstrap to main runtime classpath to avoid duplicate module packages
sourceSets.main.runtimeClasspath -= sourceSets.earlybootstrap.output

configurations { agentAsm }

repositories {
    maven { url = "https://cursemaven.com" }
    flatDir {
        dirs 'run/mods'
        }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation 'org.ow2.asm:asm:9.5'
    implementation 'org.ow2.asm:asm-tree:9.5'
    implementation 'org.ow2.asm:asm-commons:9.5'
    agentAsm 'org.ow2.asm:asm:9.5'
    agentAsm 'org.ow2.asm:asm-tree:9.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Dev runtime must expose the earlybootstrap classes (com.randomkillentity.utils/service): the main
    // sourceSet does not contain them and the production jar ships them via JarJar instead.
    // No split package: main output has no utils/service classes, and the earlyboot jar's nested
    // agent jar is not a classpath root.
    runtimeOnly files("${buildDir}/tmp/earlyboot/randomkillentity-earlyboot.jar")
    implementation fg.deobf("curse.maven:the-trial-monolith-1462850:8561617")
    implementation fg.deobf("curse.maven:no-sugar-1476611:8000478")
    implementation fg.deobf("curse.maven:curios-309927:6418456")
    implementation fg.deobf("curse.maven:apexboss-1724270:9069067")
    // pig2mod は専用サーバーでロード不可 (Pig2Mod.<init> が dist ガード無しで
    // LocalPlayer を参照 → RuntimeException: invalid dist DEDICATED_SERVER)。
    // Pig2 対戦テストは runClient (統合サーバー) で行うこと。
    implementation fg.deobf("curse.maven:pig2-1163863:6669342")
    implementation fg.deobf('mods:omnimobs:0.3.5.3')}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                         forge_version       : forge_version, forge_version_range: forge_version_range,
                         loader_version_range: loader_version_range,
                         mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                         mod_authors         : mod_authors, mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties + [project: project] }
    dependsOn buildAgentJar, buildEarlyBootJar
    from("${buildDir}/tmp/agent") { include 'randomkill-agent.jar'; into 'META-INF/jarjar' }
    // earlyboot jar is bundled in jarjar for runtime; do not merge its classes into main jar
    from("${buildDir}/tmp/earlyboot") { include 'randomkillentity-earlyboot.jar'; into 'META-INF/jarjar' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Production-only: JarJar only loads embedded jars listed in META-INF/jarjar/metadata.json
// (JarJarSelector discovery). Without it the embedded earlyboot/agent jars are dead weight and
// RandomKillEntity dies with NoClassDefFoundError: com/randomkillentity/utils/RKLog in production,
// because the jar task excludes those packages from the main jar root.
// Kept out of processResources so the dev (exploded) run never double-loads the earlyboot jar
// (dev gets it via the runtimeOnly classpath entry instead).
task generateJarJarMetadata {
    def out = file("${buildDir}/tmp/jarjar/metadata.json")
    outputs.file out
    doLast {
        out.parentFile.mkdirs()
        out.text = '''{
  "jars": [
    {
      "identifier": { "group": "com.randomkillentity", "artifact": "randomkillentity-earlyboot" },
      "version": { "artifactVersion": "1.0.0" },
      "path": "META-INF/jarjar/randomkillentity-earlyboot.jar",
      "isObfuscated": false
    },
    {
      "identifier": { "group": "com.randomkillentity", "artifact": "randomkill-agent" },
      "version": { "artifactVersion": "1.0.0" },
      "path": "META-INF/jarjar/randomkill-agent.jar",
      "isObfuscated": false
    }
  ]
}'''
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    // Exclude earlybootstrap and agent packages from main jar to avoid split-package conflicts
    exclude('com/randomkillentity/utils/**')
    exclude('com/randomkillentity/agent/**')
    dependsOn sourceSets.earlybootstrap.classesTaskName, generateJarJarMetadata
    from("${buildDir}/tmp/jarjar") { include 'metadata.json'; into 'META-INF/jarjar' }
    finalizedBy 'reobfJar'
}

task buildAgentJar(type: Jar) {
    archiveBaseName = 'randomkill-agent'
    archiveVersion = ''
    destinationDirectory = file("${buildDir}/tmp/agent")
    from(sourceSets.main.output.classesDirs) { include 'com/randomkillentity/agent/**' }
    from(sourceSets.earlybootstrap.output.classesDirs) { include 'com/randomkillentity/utils/**' }
    from({ configurations.agentAsm.collect { it.isDirectory() ? it : zipTree(it) } }) { include 'org/objectweb/asm/**' }
    from('src/main/resources') { include 'META-INF/native/**' }
    manifest { attributes(['Agent-Class': 'com.randomkillentity.agent.RKAgent','Can-Redefine-Classes':'true','Can-Retransform-Classes':'true']) }
    dependsOn compileJava, sourceSets.earlybootstrap.classesTaskName
}

task buildEarlyBootJar(type: Jar) {
    archiveBaseName = 'randomkillentity-earlyboot'
    archiveVersion = ''
    destinationDirectory = file("${buildDir}/tmp/earlyboot")
    from sourceSets.earlybootstrap.output
    from('src/main/resources') { include 'META-INF/native/**' }
    from("${buildDir}/tmp/agent") { include 'randomkill-agent.jar'; into 'META-INF/jarjar' }
    // No module-info; avoid JPMS module name conflicts with main mod
    // manifest {
    //     attributes(["Automatic-Module-Name": "com.randomkillentity.earlybootstrap"])
    // }
    dependsOn buildAgentJar
}

afterEvaluate {
    tasks.findByName('runClient')?.dependsOn(buildEarlyBootJar)
    tasks.findByName('runServer')?.dependsOn(buildEarlyBootJar)
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

